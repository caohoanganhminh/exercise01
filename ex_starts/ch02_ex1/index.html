<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Discount Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        input[type="submit"] {
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Product Discount Calculator</h1>

    <form action="display_discount.php" method="post">

        <div class="form-group">
            <label for="product_description">
                Product Description:
            </label>

            <input
                type="text"
                id="product_description"
                name="product_description"
                required
            >
        </div>

        <div class="form-group">
            <label for="list_price">
                List Price:
            </label>

            <input
                type="number"
                id="list_price"
                name="list_price"
                step="0.01"
                min="0"
                required
            >
        </div>

        <div class="form-group">
            <label for="discount_percent">
                Discount Percent:
            </label>

            <input
                type="number"
                id="discount_percent"
                name="discount_percent"
                step="0.01"
                min="0"
                max="100"
                required
            >
        </div>

        <input type="submit" value="Calculate">

    </form>

</div>

</body>
</html>
